name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Base Dependencies
        run: npm install

      - name: Install Missing Expo Web Packages
        run: npx expo install react-dom react-native-web

      - name: Build Web Production Bundle
        run: npx expo export --platform web

      - name: Force Fix Absolute Paths for GitHub Pages
        run: |
          # This replaces /_expo/ with ./_expo/ directly inside index.html
          sed -i 's|"/_expo/|"./_expo/|g' dist/index.html
          sed -i 's| src="/| src="./|g' dist/index.html
          sed -i 's| href="/| href="./|g' dist/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
