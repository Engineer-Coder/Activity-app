name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Base Dependencies
        run: npm install

      - name: Install Missing Expo Web Packages
        run: npx expo install react-dom react-native-web

      - name: Build Web Production Bundle
        run: npx expo export --platform web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Newer Expo versions output web builds to 'dist'
          branch: gh-pages
